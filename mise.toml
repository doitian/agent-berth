[tasks.changelog]
description = "Regenerate CHANGELOG.md from git history with git-cliff"
run = "git-cliff -o CHANGELOG.md"

[tasks."pre-commit:cargo-fmt"]
run = "cargo fmt --check"

[tasks.test]
run = "cargo test --no-fail-fast --{% for f in usage.filters | default(value=[]) %} {{ f }}{% endfor %}"
usage = 'arg "[filters]" var=#true'

[tasks."test:integration"]
description = "Run isolated agent-berth integration tests without model calls"
run = "cargo test --test integration"

[tasks."test:tmux"]
description = "Test resume with real tmux/psmux in a disposable namespace"
run = "cargo test --test integration real_tmux -- --ignored"

[tasks."test:live"]
description = "Test AGENT_BERTH_TEST_CLIENT with a real model call"
run = "cargo test --test integration live_client -- --ignored"

[tasks."test:mock"]
description = "Test AGENT_BERTH_TEST_CLIENT against a local mock LLM, no credentials needed"
run = "cargo test --test integration mock_llm -- --ignored"

[tasks."pre-commit:typos"]
run = "typos"

[tasks.pre-commit]
depends = ["pre-commit:*"]

[tasks.default]
run = "cargo build"

[tasks."install:stop"]
hide = true
run = '"{{ env.HOME }}/.local/bin/agent-berth" service stop || true'

[tasks.install]
description = "Build release and install into ~/.local/bin"
depends = ["install:stop"]
depends_post = ["install:start"]
run = 'cargo install --path . --force --root "{{env.HOME}}/.local"'

[tasks."install:start"]
hide = true
run = '"{{ env.HOME }}/.local/bin/agent-berth" service start || true'
