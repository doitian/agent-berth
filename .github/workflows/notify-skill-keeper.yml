# Maintainer: add repository secrets SKILL_KEEPER_WEBHOOK_URL and
# SKILL_KEEPER_WEBHOOK_TOKEN, copying the URL and key from the Skill
# Keeper routine panel in Grok Bot (routine folder
# sync-agent-berth-skill-on-push). Do not commit those values.
name: Notify Skill Keeper

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/agent-berth/**'

permissions:
  contents: read

jobs:
  notify:
    name: Notify Skill Keeper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Notify Skill Keeper webhook
        env:
          SKILL_KEEPER_WEBHOOK_URL: ${{ secrets.SKILL_KEEPER_WEBHOOK_URL }}
          SKILL_KEEPER_WEBHOOK_TOKEN: ${{ secrets.SKILL_KEEPER_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SKILL_KEEPER_WEBHOOK_URL:-}" || -z "${SKILL_KEEPER_WEBHOOK_TOKEN:-}" ]]; then
            echo "Repository secrets SKILL_KEEPER_WEBHOOK_URL and SKILL_KEEPER_WEBHOOK_TOKEN must be set" >&2
            exit 1
          fi

          curl -fsS -X POST "${SKILL_KEEPER_WEBHOOK_URL}" \
            -H "Authorization: Bearer ${SKILL_KEEPER_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"source":"doitian/agent-berth","event":"skill-changed","path":".agents/skills/agent-berth"}'
