name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Configure test temporary directory
        run: |
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TMPDIR=$env:RUNNER_TEMP`nTMP=$env:RUNNER_TEMP`nTEMP=$env:RUNNER_TEMP`n")
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - name: Check formatting
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustfmt --edition 2024 --check tests/support/fixture.rs
      - name: Run clippy
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Run unit and integration tests
        run: mbx test --locked --no-fail-fast
      - name: Install tmux
        if: runner.os != 'Windows'
        run: |
          if ($IsMacOS) {
            brew list --versions tmux *> $null
            if ($LASTEXITCODE -ne 0) { brew install tmux }
          } else {
            sudo apt-get update
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            sudo apt-get install --yes tmux
          }
      - name: Install cargo-binstall
        if: runner.os == 'Windows'
        uses: cargo-bins/cargo-binstall@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install psmux
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          cargo binstall psmux --version 3.3.8 --no-confirm
          --strategies crate-meta-data
          --pkg-url '{ repo }/releases/download/v{ version }/psmux-v{ version }-windows-x64.zip'
          --pkg-fmt zip --bin-dir '{ bin }{ binary-ext }'
      - name: Run real tmux integration test
        run: mbx test --locked --test integration real_tmux -- --ignored
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/ab-it-*/**
          if-no-files-found: ignore
          retention-days: 7

  mock-client:
    name: Mock LLM (${{ matrix.client }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        client: [claude, codex, grok, opencode, opencode2, pi]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      AGENT_BERTH_TEST_CLIENT: ${{ matrix.client == 'opencode2' && 'opencode' || matrix.client }}
    steps:
      - name: Configure test temporary directory
        run: |
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TMPDIR=$env:RUNNER_TEMP`nTMP=$env:RUNNER_TEMP`nTEMP=$env:RUNNER_TEMP`n")
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
      - name: Install client
        env:
          MATRIX_CLIENT: ${{ matrix.client }}
        run: |
          switch ($env:MATRIX_CLIENT) {
            'grok' {
              $version = (Invoke-RestMethod https://x.ai/cli/stable).Trim()
              $arch = $env:RUNNER_ARCH -eq 'ARM64' ? 'aarch64' : 'x86_64'
              $suffix = $IsWindows ? "windows-$arch.exe" : ($IsMacOS ? "macos-$arch" : "linux-$arch")
              $dir = Join-Path $env:RUNNER_TEMP 'grok-bin'
              New-Item -ItemType Directory -Force $dir | Out-Null
              $exe = Join-Path $dir ($IsWindows ? 'grok.exe' : 'grok')
              Invoke-WebRequest "https://x.ai/cli/grok-$version-$suffix" -OutFile $exe
              if (-not $IsWindows) { chmod +x $exe }
              [IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n")
            }
            default {
              $package = @{
                claude = '@anthropic-ai/claude-code'
                codex = '@openai/codex'
                opencode = 'opencode-ai'
                opencode2 = '@opencode/cli'
                pi = '@earendil-works/pi-coding-agent'
              }[$env:MATRIX_CLIENT]
              npm install -g $package
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $prefix = npm prefix -g
              $bin = $IsWindows ? $prefix : (Join-Path $prefix 'bin')
              [IO.File]::AppendAllText($env:GITHUB_PATH, "$bin`n")
            }
          }
      - name: Run mock LLM client test
        run: mbx test --locked --test integration mock_llm -- --ignored
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-diagnostics-${{ matrix.os }}-${{ matrix.client }}
          path: ${{ runner.temp }}/ab-it-*/**
          if-no-files-found: ignore
          retention-days: 7
