name: Publish

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./.github/scripts/check-release.ps1 -Tag $env:RELEASE_TAG
      - name: Check publishing metadata
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read Cargo metadata' }
          $package = $metadata.packages | Where-Object { $_.manifest_path -eq (Resolve-Path Cargo.toml).Path }
          if (-not $package.repository) { throw 'Set package.repository in Cargo.toml for cargo-binstall release discovery' }
          if (-not $package.license -and -not $package.license_file) { throw 'Set the chosen package.license or license-file in Cargo.toml' }
      - name: Verify crate package
        run: cargo publish --locked --dry-run

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  binaries:
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.version }}
      PACKAGE_NAME: ${{ needs.check.outputs.name }}
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target $env:BUILD_TARGET
      - name: Package and check binary
        run: ./.github/scripts/package-release.ps1 -Target $env:BUILD_TARGET -Version $env:RELEASE_VERSION -Name $env:PACKAGE_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, tests, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate release notes from the tag's changelog section
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object FullName)
          if ($assets.Count -ne 8) { throw 'Expected four archives and four checksums' }
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--verify-tag', '--title', $env:RELEASE_TAG, '--notes-file', 'RELEASE_NOTES.md')
          if ($env:RELEASE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          gh @arguments @assets

  publish:
    needs: [check, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
