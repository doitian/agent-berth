[package]
name = "agent-berth"
version = "1.2.1"
edition = "2024"
description = "Monitor and resume coding agents"
license = "MPL-2.0"
repository = "https://github.com/doitian/agent-berth"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "LICENSE*"]

[lib]
name = "agent_berth"

[[bin]]
name = "agent-berth"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
crossterm = "0.29"
interprocess = "2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
redb = "4.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
